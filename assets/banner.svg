<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes floatSlow1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatSlow2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barPulse {
      0%, 100% { height: 35px; y: 15px; }
      50% { height: 50px; y: 0px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 48px; y: 2px; }
      50% { height: 28px; y: 22px; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 24px; y: 26px; }
      50% { height: 42px; y: 8px; }
    }

    .bg-grid {
      stroke: #334155;
      stroke-width: 1;
      stroke-opacity: 0.15;
    }
    .orb-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .pill-1 {
      animation: floatSlow1 7s ease-in-out infinite;
    }
    .pill-2 {
      animation: floatSlow2 8s ease-in-out infinite;
    }
    .pill-3 {
      animation: floatSlow1 6.5s ease-in-out infinite 1s;
    }
    .pill-4 {
      animation: floatSlow2 7.5s ease-in-out infinite 1.5s;
    }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 15s linear infinite;
    }
    .bar-anim-1 {
      animation: barPulse 3.5s ease-in-out infinite;
    }
    .bar-anim-2 {
      animation: barPulse2 4s ease-in-out infinite 0.5s;
    }
    .bar-anim-3 {
      animation: barPulse3 3.8s ease-in-out infinite 1s;
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Coordinate Grid -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle class="orb-glow" cx="180" cy="100" r="140" fill="#f59e0b" opacity="0.18" filter="url(#glow-filter)" />
  <circle class="orb-glow" cx="1020" cy="300" r="160" fill="#8b5cf6" opacity="0.20" filter="url(#glow-filter)" />
  <circle class="orb-glow" cx="600" cy="380" r="120" fill="#06b6d4" opacity="0.15" filter="url(#glow-filter)" />

  <!-- Animated Data / Connection Flow Lines (Background) -->
  <path class="flow-path" d="M 80 340 Q 300 390 600 340 T 1120 330" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path class="flow-path" d="M 120 70 Q 500 20 850 70 T 1100 120" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.25" />

  <!-- DYNAMIC BACKGROUND ACCENTS (Positioned safely away from center title) -->

  <!-- Top-Left Floating Card: Live Revenue / Ticket Size -->
  <g class="pill-1" transform="translate(60, 45)" filter="url(#soft-shadow)">
    <rect width="180" height="64" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">TABLE #14 • SERVICE</text>
    <text x="20" y="50" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#10b981">$342.50 <tspan font-size="12" fill="#64748b">PAID</tspan></text>
    <!-- Mini Mini Chart -->
    <g transform="translate(130, 24)">
      <rect x="0" y="10" width="6" height="18" rx="2" fill="#3b82f6" class="bar-anim-1" />
      <rect x="10" y="2" width="6" height="26" rx="2" fill="#10b981" class="bar-anim-2" />
      <rect x="20" y="14" width="6" height="14" rx="2" fill="#f59e0b" class="bar-anim-3" />
    </g>
  </g>

  <!-- Top-Right Floating Pill: Guest CRM Tagging -->
  <g class="pill-2" transform="translate(930, 45)" filter="url(#soft-shadow)">
    <rect width="210" height="60" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="30" r="14" fill="#6366f1" opacity="0.3" />
    <text x="22" y="35" font-size="14">🍷</text>
    <text x="52" y="27" class="badge-pill-text" fill="#f8fafc">VIP Diner Tagged</text>
    <text x="52" y="45" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Prefers Patio • 12 Visits</text>
  </g>

  <!-- Bottom-Left Floating Pill: POS / KDS Status -->
  <g class="pill-4" transform="translate(60, 310)" filter="url(#soft-shadow)">
    <rect width="195" height="58" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="26" cy="29" r="6" fill="#10b981" />
    <text x="44" y="26" class="badge-pill-text" fill="#f8fafc">KDS Live Sync</text>
    <text x="44" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#6ee7b7">0.4s Ticket Latency</text>
  </g>

  <!-- Bottom-Right Floating Pill: Real-time Food Cost -->
  <g class="pill-3" transform="translate(945, 310)" filter="url(#soft-shadow)">
    <rect width="195" height="58" rx="14" fill="url(#card-grad)" stroke="#334155" stroke-width="1" />
    <text x="20" y="27" class="badge-pill-text" fill="#f8fafc">Back-of-House OCR</text>
    <text x="20" y="45" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8">28.4% Food Cost Target</text>
  </g>

  <!-- FOREGROUND LAYER: CENTER HERO CONTENT (Guaranteed never hidden) -->

  <!-- Glow Backdrop for Title (Centered) -->
  <ellipse cx="600" cy="205" rx="340" ry="85" fill="#030712" opacity="0.85" filter="url(#soft-shadow)" />

  <!-- Top Category Capsule -->
  <g transform="translate(485, 115)">
    <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#f59e0b" />
    <text x="30" y="19" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" letter-spacing="1">HOSPITALITY &amp; F&amp;B TECH</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 195)" filter="url(#soft-shadow)">
    <text class="title-text" text-anchor="middle">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#primary-glow)">Food &amp; Beverage</tspan>
      <tspan fill="#ffffff"> CRM</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text class="subtitle-text" x="600" y="235" text-anchor="middle">
    Top Restaurant Platforms, Guest Engagement Clouds &amp; Open-Source POS Ecosystems
  </text>

  <!-- Feature Pills Strip in Center Foreground -->
  <g transform="translate(230, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="82" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">🍽️ Cloud POS</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="185" height="32" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="272" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">👥 Guest Retention CRM</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="467" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#fbbf24" text-anchor="middle">📅 Table Reservations</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="170" height="32" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="655" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981" text-anchor="middle">📦 BOH Food Costing</text>
  </g>
</svg>
